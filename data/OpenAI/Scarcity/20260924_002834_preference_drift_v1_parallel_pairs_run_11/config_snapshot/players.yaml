      B: 0
      C: 3
    utility_type: shifted_cobb_douglas
    utility_formula: "(x_A+1)^0.7 * (x_B+1)^0.2 * (x_C+1)^0.1"
    utility_weights:
      A: 0.7
      B: 0.2
      C: 0.1
    preference_description: >
      You are a builder. Good A is the most important good to you, but each additional unit of A is less valuable than the previous one.
      Good B is moderately useful to acquire, especially if you have little or none. Good C is only weakly useful, though it still has some value.
