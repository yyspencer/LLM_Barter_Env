version: 1

model_pool:
  - id: gpt
    enabled: true
    provider: openai
    model: gpt-5.6-terra
    api_env_var: OPENAI_API_KEY
    count: 6
    generation:
      temperature: 1
      max_tokens: 1000
      timeout_seconds: 60

  - id: gemini
    enabled: false
    provider: google
    model: gemini-3.1-pro-preview
    api_env_var: GEMINI_API_KEY
    count: 0
    generation:
      temperature: 1
      max_tokens: 1000
      timeout_seconds: 60

  - id: claude
    enabled: false
    provider: anthropic
    model: claude-sonnet-5
    api_env_var: ANTHROPIC_API_KEY
    count: 0
    generation:
      temperature: 0.7
      max_tokens: 1000
      timeout_seconds: 60

  - id: grok
    enabled: false
    provider: xai
    model: grok-4
    api_env_var: XAI_API_KEY
    count: 0
    generation:
      temperature: 0.7
      max_tokens: 400
      timeout_seconds: 60

assignment:
  mode: expand_by_count