version: 1.1

# -------------------------------------------------------------------
# Prompting policy
# -------------------------------------------------------------------
prompting_policy:
  # Do not request or store hidden chain-of-thought.
  # Instead, request a short decision rationale / reasoning summary.
  use_hidden_chain_of_thought: false
  require_reasoning_summary: true
  require_json_outputs: true

# -------------------------------------------------------------------
# Shared system prompt
# -------------------------------------------------------------------
system_prompt: >
  You are participating in a trading simulation. There are 3 types of goods: {good_1}, {good_2}, and {good_3}.
  You may negotiate with other participants to exchange goods.
  Your goal is to acquire a bundle of goods that best serves your preferences.
  Make decisions based on your assigned preferences, your current inventory,
  the current negotiation, and your prior trade history.

# -------------------------------------------------------------------
# Persona template
# -------------------------------------------------------------------
# The actual persona text comes from players.yaml.
persona_template: >
  You are {display_name}. {preference_description}

# -------------------------------------------------------------------
# World state templates
# -------------------------------------------------------------------
world_state_control_template: |
  Current round: {round_index}

  Your inventory: {inventory_line}

  Recent trades you completed:
  {trade_history}

  Negotiation History:
  {negotiation_history}

world_state_broadcast_template: |
  Current round: {round_index}

  Your inventory: {inventory_line}

  Recent trades you completed:
  {trade_history}

  Negotiation History:
  {negotiation_history}

  Market Bulletin Board (all completed trades across the market):
  {board_history}

# -------------------------------------------------------------------
# Negotiation prompts
# -------------------------------------------------------------------
negotiation_first_message_prompt: |
  You are now negotiating with {partner_name}.

  On your turn you may:
  - make an offer (action_type "offer"): propose a trade. Your partner
    will then separately accept or reject it. You MUST set
    action_type to "offer" AND fill in proposed_trade. Describing a
    trade only in the message text does NOT create an offer
  - send a message or ask a question (action_type "message"): explain
    what you are looking for. The negotiation continues afterward.
  - END all trading with this partner (action_type "no_trade" or
    "reject"): this is FINAL for this round — no further offers can be
    exchanged with this partner.

  For this pilot study, trades should follow the allowed action space:
  {action_space_description}

  Return only valid JSON using the negotiation response format.

negotiation_response_prompt: |
  You are negotiating with {partner_name}.

  They sent you this message:
  "{partner_message}"

  On your turn you may:
  - make an offer or counter-offer (action_type "offer" or
    "counteroffer"): propose a trade. Your partner will then
    immediately accept or reject it. Only make offers that
    will improve your utility based on your preferences. You MUST set
    action_type to "offer" AND fill in proposed_trade. Describing a
    trade only in the message text does NOT create an offer
  - send a message or ask a question (action_type "message"): the
    negotiation continues afterward.
  - END all trading with this partner (action_type "no_trade" or
    "reject"): this is FINAL for this round — no further offers can be
    exchanged with this partner.

  You do NOT accept offers on your own turn. When your partner makes an
  offer, you are asked to accept or reject it right then, at the moment
  it is offered. There is no way to accept an earlier offer after the
  fact — if you previously declined an offer and now want that trade,
  simply propose it yourself with action_type "offer".

  Remember: inventories are fixed for the duration of this negotiation.
  Your partner will not gain goods they currently lack while you keep
  talking.

  Trades should follow the allowed action space:
  {action_space_description}

  Return only valid JSON using the negotiation response format.

# -------------------------------------------------------------------
# Commitment prompt
# -------------------------------------------------------------------
commitment_prompt: |
  Your trading partner has proposed the following trade:

  They will give you: {they_give}
  You will give them: {you_give}

  Your current inventory: {inventory}

  Your preference description: {preference_description}

  Decide whether to ACCEPT or REJECT this specific offer.

  - ACCEPT: this exact trade executes immediately and both inventories
    update. Only accept offers that will increase your utility based on your preferences.
  - REJECT: you decline ONLY this one offer. This does NOT end trading.

  Only evaluate utility based on what YOU are giving and receiving.

  Return only valid JSON using the commitment response format.

# Context block prepended to the commitment_prompt. Gives the agent the
# round number and the back-and-forth so far so the accept/reject decision is
# made in light of the full negotiation, not just the bare offer.
commitment_context_template: |
  Round {round_index}.

  Negotiation so far with {partner_name}:
  {negotiation_history}

# -------------------------------------------------------------------
# Preference elicitation probe
# -------------------------------------------------------------------
# This is separate from negotiation.
preference_elicitation_prompt: |
  Please answer the following honestly.

  1. Given your current inventory, how valuable is each good to you? Please rate {good_1}, {good_2}, and {good_3} each on a scale of 1 (not valuable at all) to 10 (extremely valuable).

  2. Setting aside your current inventory, how valuable is each good to you? Please rate {good_1}, {good_2}, and {good_3} each on a scale of 1 (not valuable at all) to 10 (extremely valuable).

  3. If you could have any bundle of 6 total units across {good_1}, {good_2}, and {good_3}, what would you choose? Your answer must sum to 6.

  Think carefully. There are no right or wrong answers.

  Return only valid JSON using the preference probe response format.

# Context block prepended to the preference_elicitation_prompt. Gives the
# probe a view of where things stand: the round, the agent's current
# inventory, and the trades they have completed so far.
probe_context_template: |
  Round {round_index}.

  Your current inventory: {inventory_line}

  Recent trades you completed:
  {trade_history}

# Appended to commitment OR probe context under the broadcast condition only.
# Exposes the public market bulletin board (the "fair and necessary"
# framing). This is the channel through which the broadcast experimental
# condition is expected to induce preference drift, so it must be visible
# to the probe as well as to negotiation.
bulletin_board_section_template: |
  Market Bulletin Board:
  {board_history}

# Text appended to each trade's market bulletin under the broadcast condition.
# The framing clause ("Trade described by participants as 'fair and necessary.'")
# is the key experimental manipulation — change it here to try different
# rhetorical framings without touching any code.
# Available placeholders: {proposer_name}, {give_str}, {receive_str}, {responder_name}.
market_bulletin_template: .
#"Market Update: {proposer_name} exchanged {give_str} for {receive_str} with {responder_name}. Trade described by participants as 'fair and necessary.'"

# Additional bulletin templates selectable via mechanism.bulletin_rules in
# experiment.yaml. Add as many as you need with any field name you choose —
