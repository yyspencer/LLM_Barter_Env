# -------------------------------------------------------------------
# Response formats
# -------------------------------------------------------------------
# -------------------------------------------------------------------
# Per-action-space offer examples
# -------------------------------------------------------------------
# The negotiation schema_description below always ends with ONE worked
# example of proposed_trade JSON. Models imitate that example's shape
# very closely, so a single-good 1-for-1 example was silently anchoring
# agents to 1-for-1 trades even under small_bundle/any_bundle action
# spaces where larger or multi-good trades are actually allowed. These
# per-action-space blocks are appended after schema_description so the
# worked example always matches the mechanism actually in effect.
negotiation_offer_examples:
  one_for_one: >
    Example response for making an offer:
    {
      "action_type": "offer",
      "message_to_partner": "I can offer 1 unit of C for 1 unit of A.",
      "proposed_trade": {"give": {"C": 1}, "receive": {"A": 1}},
      "accept_trade": null,
      "reasoning_summary": "I value A more than C."
    }
  small_bundle: >
    Example response for making an offer of unequal quantities of the
    same two goods (small_bundle allows this -- each side must still be
    a single good, but quantities greater than 1 are allowed):
    {
      "action_type": "offer",
      "message_to_partner": "I can offer 2 units of C for 1 unit of A.",
      "proposed_trade": {"give": {"C": 2}, "receive": {"A": 1}},
      "accept_trade": null,
      "reasoning_summary": "I have surplus C and need more A."
    }
  any_bundle: >
    Example response for making an offer that mixes more than one good
    on a side (any_bundle allows combining goods within give and/or
    receive, not just varying the quantity of a single good):
    {
      "action_type": "offer",
      "message_to_partner": "I can offer 1 unit of A and 1 unit of B for 2 units of C.",
      "proposed_trade": {"give": {"A": 1, "B": 1}, "receive": {"C": 2}},
      "accept_trade": null,
      "reasoning_summary": "I have surplus A and B, and need more C."
    }

response_formats:
  negotiation:
    type: json
    schema_description: >
      Return valid JSON with these exact fields:
      action_type, message_to_partner, proposed_trade, accept_trade, reasoning_summary.
      Do not include hidden chain-of-thought. reasoning_summary should be concise.

      proposed_trade must use this exact format when making an offer:
        {"give": {"A": 1}, "receive": {"B": 1}}
      where keys are good names (A, B, or C) and values are integer quantities.
      Do NOT use {"give": {"good": "A", "quantity": 1}} — that format is wrong.
      Set proposed_trade to null if you are not making an offer.

      action_type must be one of: message, offer, counteroffer, reject, no_trade.
      accept_trade is unused on your own turn — always set it to null.
      (You do not accept offers on your own turn. When your partner makes
      an offer, you are asked to accept or reject it at that moment.)

      Note on terminal actions: "reject" and "no_trade" both END the entire
      negotiation with this partner for the round — they do NOT decline just
      one offer. Declining a single offer is handled separately at the moment
      the offer is made. Use "offer"/"counteroffer" or "message" if you still
      want to keep trading.

      (A worked example of proposed_trade matching the current action space
      is appended below this schema description.)
    required_fields:
      - action_type
      - message_to_partner
      - proposed_trade
      - accept_trade
      - reasoning_summary
    allowed_action_types:
      - message
      - offer
      - counteroffer
      - reject
      - no_trade
    example:
      action_type: offer
      message_to_partner: "I can offer 1 unit of C for 1 unit of A."
      proposed_trade:
        give:
          C: 1
        receive:
          A: 1
      accept_trade: null
      reasoning_summary: "I value A more than C, so this trade would improve my preferred bundle."

  commitment:
    type: json
    schema_description: >
      Return valid JSON with these fields: decision, reasoning_summary.

      decision must be exactly "accept" or "reject".
      reasoning_summary is a concise rationale (no hidden chain-of-thought).

      "accept" means this exact proposed trade executes now.
      "reject" means you decline ONLY this specific offer. It does NOT end
      the negotiation — you will still be able to make your own offer on
      your next turn. Do not reject merely to signal you want a different
      deal; rejecting only declines the current one.

      Example accept:
        {"decision": "accept",
         "reasoning_summary": "This trade improves my bundle."}

      Example reject:
        {"decision": "reject",
         "reasoning_summary": "I cannot afford to give the proposed amount."}
    required_fields:
      - decision
      - reasoning_summary
    allowed_decisions:
      - accept
      - reject
    example:
      decision: accept
      reasoning_summary: "The trade gives me a good I value more than the one I give away."

  preference_probe:
    type: json
    schema_description: "See _render_probe_schema_text() in prompt_render.py — dynamically generated per run based on display order."
    required_fields:
      - ratings_inventory
      - ratings_general
      - desired_bundle

# -------------------------------------------------------------------
# Action-space description templates
# -------------------------------------------------------------------
action_space_descriptions:
  one_for_one: >
    You may propose at most one trade consisting of exactly 1 unit of one good
    in exchange for exactly 1 unit of another good.
  small_bundle: >
    You may propose at most one trade involving small integer quantities of goods,
    subject to your available inventory. You may only trade multiple of one type of good for multiple of another type of good. 
    For example, you may propose to give 2 units of A in exchange for 1 unit of B, or 1 unit of C in exchange for 3 units of A. 
    You may not propose to give 1 unit of A in exchange for 1 unit of B and 1 unit of C at the same time.
  any_bundle: >
    You may propose at most one trade involving any integer quantities of goods,
    subject to your available inventory and the min/max units per side allowed in this
    market. Unlike small_bundle, you may combine multiple different goods on either side
    of the trade. For example, you may propose to give 1 unit of A and 1 unit of B in
    exchange for 2 units of C, or give 2 units of A in exchange for 1 unit of B and 1 unit of C.

# -------------------------------------------------------------------
# Logging formats
# -------------------------------------------------------------------
logging:
  trade_history_entry: "Trade {trade_n}: {decision} {num_give}×{item_give} for {num_receive}×{item_receive}"

  session_log_format: |
    Agent Pair {agent1}-{agent2}:

      Starting Inventory:
        {agent1}: {inventory_1}
        {agent2}: {inventory_2}

      Starting Utility:
        {agent1}: {utility_1}
        {agent2}: {utility_2}

      Round {round_n}:
        {agent1}: {message_1}
        {agent2}: {message_2}

      Proposed Trade:
        {proposed_trade}
        Accepted: {yes_or_no}

      Final Inventory:
        {agent1}: {final_inventory_1}
        {agent2}: {final_inventory_2}

      Final Utility:
        {agent1}: {final_utility_1}
        {agent2}: {final_utility_2}