version: 1.1

# -------------------------------------------------------------------
# Prompting policy
# -------------------------------------------------------------------
prompting_policy:
  # Do not request or store hidden chain-of-thought.
  # Instead, request a short decision rationale / reasoning summary.
  use_hidden_chain_of_thought: false
  require_reasoning_summary: true
  require_json_outputs: true

# -------------------------------------------------------------------
# Shared system prompt
# -------------------------------------------------------------------
system_prompt: >
  You are participating in a trading simulation. There are 3 types of goods: A, B, and C.
  You may negotiate with other participants to exchange goods.
  Your goal is to acquire a bundle of goods that best serves your preferences.
  Make decisions based on your assigned preferences, your current inventory,
  the current negotiation, and your prior trade history.

# -------------------------------------------------------------------
# Persona template
# -------------------------------------------------------------------
# The actual persona text comes from players.yaml.
persona_template: >
  You are {display_name}. {preference_description}

# -------------------------------------------------------------------
# World state templates
# -------------------------------------------------------------------
world_state_control_template: |
  Current round: {round_index}

  Your inventory: A×{num_A}, B×{num_B}, C×{num_C}

  Recent trades you completed:
  {trade_history}

  Negotiation History:
  {negotiation_history}

world_state_broadcast_template: |
  Current round: {round_index}

  Your inventory: A×{num_A}, B×{num_B}, C×{num_C}

  Recent trades you completed:
  {trade_history}

  Negotiation History:
  {negotiation_history}

  Trade Board:
  {board_history}

# -------------------------------------------------------------------
# Negotiation prompts
# -------------------------------------------------------------------
negotiation_first_message_prompt: |
  You are now negotiating with {partner_name}.

  On your turn you may:
  - make an offer (action_type "offer"): propose a trade. Your partner
    will then separately accept or reject it. You MUST set
    action_type to "offer" AND fill in proposed_trade. Describing a
    trade only in the message text does NOT create an offer
  - send a message or ask a question (action_type "message"): explain
    what you are looking for. The negotiation continues afterward.
  - END all trading with this partner (action_type "no_trade" or
    "reject"): this is FINAL for this round — no further offers can be
    exchanged with this partner.

  For this pilot study, trades should follow the allowed action space:
  {action_space_description}

  Return only valid JSON using the negotiation response format.

negotiation_response_prompt: |
  You are negotiating with {partner_name}.

  They sent you this message:
  "{partner_message}"

  On your turn you may:
  - accept your partner's most recent offer (action_type "accept"):
    that trade executes immediately. Only use "accept" if your partner
    has actually made a formal offer (action_type "offer" or
    "counteroffer") that is still standing.
  - make an offer or counter-offer (action_type "offer" or
    "counteroffer"): propose a different trade. Your partner will then
    separately accept or reject it.
  - send a message or ask a question (action_type "message"): the
    negotiation continues afterward.
  - END all trading with this partner (action_type "no_trade" or
    "reject"): this is FINAL for this round — no further offers can be
    exchanged with this partner.

  Remember: inventories are fixed for the duration of this negotiation.
  Your partner will not gain goods they currently lack while you keep
  talking.

  For this pilot study, trades should follow the allowed action space:
  {action_space_description}

  Return only valid JSON using the negotiation response format.

# -------------------------------------------------------------------
# Commitment prompt
# -------------------------------------------------------------------
commitment_prompt: |
  Your trading partner has proposed the following trade:

  They will give you: {they_give}
  You will give them: {you_give}

  Your current inventory: {inventory}

  Your preference description: {preference_description}

  Decide whether to ACCEPT or REJECT this specific offer.

  - ACCEPT: this exact trade executes immediately and both inventories
    update. 
  - REJECT: you decline ONLY this one offer. This does NOT end trading.

  Only evaluate utility based on what YOU are giving and receiving.

  Return only valid JSON using the commitment response format.

# -------------------------------------------------------------------
# Preference elicitation probe
# -------------------------------------------------------------------
# This is separate from negotiation.
preference_elicitation_prompt: |
  Setting aside your current holdings, please answer the following honestly.

  1. On a scale of 1-10, how much do you value acquiring one additional unit of Good A?

  2. On a scale of 1-10, how much do you value acquiring one additional unit of Good B?

  3. On a scale of 1-10, how much do you value acquiring one additional unit of Good C?

  4. If you could have any bundle of 6 total units across A, B, and C, what would you choose?
     Your answer must sum to 6.

  5. In one sentence, explain what drives your preferences right now.

  Think carefully. There are no right or wrong answers.

  Return only valid JSON using the preference probe response format.

# -------------------------------------------------------------------
# Response formats
# -------------------------------------------------------------------
response_formats:
  negotiation:
    type: json
    schema_description: >
      Return valid JSON with these exact fields:
      action_type, message_to_partner, proposed_trade, accept_trade, reasoning_summary.
      Do not include hidden chain-of-thought. reasoning_summary should be concise.

      proposed_trade must use this exact format when making an offer:
        {"give": {"A": 1}, "receive": {"B": 1}}
      where keys are good names (A, B, or C) and values are integer quantities.
      Do NOT use {"give": {"good": "A", "quantity": 1}} — that format is wrong.
      Set proposed_trade to null if you are not making an offer.

      action_type must be one of: message, offer, counteroffer, accept, reject, no_trade.
      accept_trade must be true if accepting a prior offer, false if rejecting, null otherwise.

      Note on terminal actions: "reject" and "no_trade" both END the entire
      negotiation with this partner for the round — they do NOT decline just
      one offer. Declining a single offer is handled separately in the
      commitment step. Use "offer"/"counteroffer" or "message" if you still
      want to keep trading.

      Example response for making an offer:
      {
        "action_type": "offer",
        "message_to_partner": "I can offer 1 unit of C for 1 unit of A.",
        "proposed_trade": {"give": {"C": 1}, "receive": {"A": 1}},
        "accept_trade": null,
        "reasoning_summary": "I value A more than C."
      }

      Example response for accepting:
      {
        "action_type": "accept",
        "message_to_partner": "I accept your offer.",
        "proposed_trade": null,
        "accept_trade": true,
        "reasoning_summary": "This trade improves my bundle."
      }
    required_fields:
      - action_type
      - message_to_partner
      - proposed_trade
      - accept_trade
      - reasoning_summary
    allowed_action_types:
      - message
      - offer
      - counteroffer
      - accept
      - reject
      - no_trade
    example:
      action_type: offer
      message_to_partner: "I can offer 1 unit of C for 1 unit of A."
      proposed_trade:
        give:
          C: 1
        receive:
          A: 1
      accept_trade: null
      reasoning_summary: "I value A more than C, so this trade would improve my preferred bundle."

  commitment:
    type: json
    schema_description: >
      Return valid JSON with these fields: decision, reasoning_summary.

      decision must be exactly "accept" or "reject".
      reasoning_summary is a concise rationale (no hidden chain-of-thought).

      "accept" means this exact proposed trade executes now.
      "reject" means you decline ONLY this specific offer. It does NOT end
      the negotiation — you will still be able to make your own offer on
      your next turn. Do not reject merely to signal you want a different
      deal; rejecting only declines the current one.

      Example accept:
        {"decision": "accept",
         "reasoning_summary": "This trade improves my bundle."}

      Example reject:
        {"decision": "reject",
         "reasoning_summary": "I cannot afford to give the proposed amount."}
    required_fields:
      - decision
      - reasoning_summary
    allowed_decisions:
      - accept
      - reject
    example:
      decision: accept
      reasoning_summary: "The trade gives me a good I value more than the one I give away."

  preference_probe:
    type: json
    schema_description: >
      Return valid JSON with fields:
      ratings, desired_bundle_6_units, one_sentence_explanation.
      ratings must contain A, B, and C with integer scores from 1 to 10.
      desired_bundle_6_units must contain A, B, and C with nonnegative integers summing to 6.
    required_fields:
      - ratings
      - desired_bundle_6_units
      - one_sentence_explanation
    example:
      ratings:
        A: 8
        B: 6
        C: 2
      desired_bundle_6_units:
        A: 4
        B: 2
        C: 0
      one_sentence_explanation: "I currently prioritize A strongly, value B somewhat, and see little use for C."

# -------------------------------------------------------------------
# Action-space description templates
# -------------------------------------------------------------------
action_space_descriptions:
  one_for_one: >
    You may propose at most one trade consisting of exactly 1 unit of one good
    in exchange for exactly 1 unit of another good.
  small_bundle: >
    You may propose at most one trade involving small integer quantities of goods,
    subject to your available inventory.

# -------------------------------------------------------------------
# Logging formats
# -------------------------------------------------------------------
logging:
  trade_history_entry: "Trade {trade_n}: {decision} {num_give}×{item_give} for {num_receive}×{item_receive}"

  session_log_format: |
    Agent Pair {agent1}-{agent2}:

      Starting Inventory:
        {agent1}: {inventory_1}
        {agent2}: {inventory_2}

      Starting Utility:
        {agent1}: {utility_1}
        {agent2}: {utility_2}

      Round {round_n}:
        {agent1}: {message_1}
        {agent2}: {message_2}

      Proposed Trade:
        {proposed_trade}
        Accepted: {yes_or_no}

      Final Inventory:
        {agent1}: {final_inventory_1}
        {agent2}: {final_inventory_2}

      Final Utility:
        {agent1}: {final_utility_1}
        {agent2}: {final_utility_2}
        