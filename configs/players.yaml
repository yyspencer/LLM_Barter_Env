version: 1

players:
  - id: player_1
    display_name: Agent 1
    role: Builder
    model_id: gpt
    inventory:
      A: 1
      B: 0
      C: 3
    utility_type: shifted_cobb_douglas
    utility_formula: "(x_A+1)^0.7 * (x_B+1)^0.2 * (x_C+1)^0.1"
    utility_weights:
      A: 0.70
      B: 0.20
      C: 0.10
    preference_description: >
      You are a builder. Good A is your primary material — you need as much as possible.
      Good B has occasional use in your work. Good C is almost useless to you. However,
      you still find value in accumulating a variety of goods, as too much of any one good
      provides deminishing returns.

    #Fully Rational
    #You must maximize your utility according to this function: (x_A+1)^0.7 * (x_B+1)^0.2 * (x_C+1)^0.1, 
    #where x_A, x_B, and x_C are the total quantities of each good you have after trading.

