version: 1

experiment:
  name: preference_drift_v1_parallel_pairs
  description: >
    Multi-agent barter environment for measuring stated and revealed preference
    drift under repeated pairwise negotiation. Agents trade in independent pairs
    within each round, and all pairs in the same round can be run in parallel.
  seed: 42
  num_runs: 1

market:
  goods:
    - A
    - B
    - C
  num_players: 6

rounds:
  # Total scheduled rounds = round_multiplier * (num_players - 1)
  # For round_robin_pairing, num_players - 1 gives one full cycle when num_players is even.
  mode: round_robin
  round_multiplier: 2
  max_rounds_override: null

# Washout: extra rounds appended after the normal schedule above, to see
# whether the broadcast manipulation's effects on stated/revealed
# preferences persist once the bulletin board goes away. With the current
# rounds config (base = round_multiplier * (num_players - 1) = 2 * 5 = 10),
# num_rounds: 4 appends rounds 11-14.
washout:
  enabled: true
  num_rounds: 4
  # If true, the market bulletin board is not shown to (or added to) during
  # these washout rounds, even if mechanism.broadcast_completed_trades is on.
  disable_broadcast: true
  # 1-indexed positions within the washout block to probe after. [2, 4]
  # means "after washout round 2" and "after the final (4th) washout round"
  probe_after_washout_rounds: [2, 4]

pairing:
  # Each round creates disjoint pairs. Since each player appears in at most one
  # pair per round, all pairs in that round can be negotiated in parallel.
  mode: round_robin_disjoint_pairs
  allow_repeat_pairings_within_cycle: false
  reshuffle_between_runs: true
  handle_odd_player_count: bye

mechanism:
  #parallel_pairs not implemented, runs sequentially within each round
  execution_mode: parallel_pairs
  synchronization: end_of_round

  negotiation_turns_per_agent: 5
  # The action space defines the set of possible actions an agent can take during negotiation.
  # Possible values:
  #   any_bundle: agent can propose any combination of goods
  #   small_bundle: each side must be a single good type, but any quantity (e.g. 2×A for 1×C)
  #   one_for_one: agent can only propose trades involving a single good for a single good
  action_space: any_bundle
  allow_no_trade: true
  require_mutual_acceptance: true
  enforce_inventory_constraints: true
  integer_goods_only: true

  anonymous: false
  broadcast_completed_trades: false
  # Only broadcast trades involving these players. Null = broadcast all trades.
  # Example: [player_1, player_5] = only trades where agent 1 or 5 participates.
  # Currently set to none (looks for a player named "none," but since it doesn't exist, no trades are broadcast)
  broadcast_filter_players: [none]
  # Optional: pick a different bulletin template depending on who's trading
  # and what they're gaining. Each rule has:
  #   player:   the agent ID to check
  #   gains:    the good they need to be gaining (A, B, or C)
  #   template: the name of a template field in prompts.yaml
  # A rule matches when `player` is a participant (proposer or responder) and
  # gains the specified good. First matching rule wins. If rules are set and
  # none match, the trade is NOT broadcast. prompts.yaml's
  # market_bulletin_template is only used when bulletin_rules is null/empty.
  # To disable, set to null.
  # Example:
  bulletin_rules:
    #  - player: player_3
    #    gains: B
    #    template: bulletin_p3_gains_b
    #  - player: player_4
    #    gains: B
    #    template: bulletin_p4_gains_b 
    #  - player: player_3
    #    gains: A
    #    template: bulletin_p3_gains_a
    #  - player: player_4
    #    gains: A
    #    template: bulletin_p4_gains_a
    #  - player: player_1
    #    gains: C
    #    template: bulletin_p1_gains_c
    #  - player: player_2
    #    gains: C
    #    template: bulletin_p2_gains_c
    #  - player: player_3
    #    gains: C
    #    template: bulletin_p3_gains_c
    #  - player: player_4
    #    gains: C
    #    template: bulletin_p4_gains_c
  mediator_enabled: false

trade_rules:
  require_mutual_acceptance: true
  allow_counteroffers: true
  enforce_inventory_constraints: true
  integer_goods_only: true
  min_units_per_side: 1
  max_units_per_side: null  # set to null (or omit) for no upper bound; still limited by each agent's inventory

  # Conflicts should not happen because players appear in only one pair
  # per round. This is here to streamline future scalability
  conflict_resolution:
    enabled: true
    method: reject_conflicting_trades

utility:
  terminal_utility:
    type: shifted_cobb_douglas
    shift: 1.0
    normalize_weights: true

preference_drift:
  enabled: true

  # Survey/probe schedule.
  #
  # mode: "midpoint"  -> fire ONE mid-run probe after the middle round,
  #   computed as (total_rounds + 1) // 2. 
  #
  # mode: "interval_rounds" -> fire a probe every `interval_rounds`
  #   completed rounds (after rounds r, 2r, 3r, ...). Recurring. 
  #    NOTE: interval_rounds runs even after the last round, so currently include_post_probe
  #    is set to false to prevent double-probing
  #
  # interval_rounds below is only read when mode is "interval_rounds".
  probe_schedule:
    mode: interval_rounds
    interval_rounds: 5
    include_pre_probe: true
    include_post_probe: false

  # Store the elicited stated preferences separately from trade logs.
  save_probe_responses: true

  # Shadow trades: hypothetical one-off commitment offers sent to each
  # player in player_ids alongside each preference probe, to get acquire/surrender signal
  # on goods that don't come up often enough in real negotiated trades.
  # Each agent sees a normal-looking commitment prompt (so it reads as a
  # real offer), but the decision is never applied to inventories and never
  # leaks into any later prompt.
  shadow_trades:
    enabled: true
    focal_goods: [B]
    counter_goods: null       # null = every other market good (A, C)
    focal_quantity: 1
    counter_quantities: [1, 2]
    directions: [acquire, surrender]
    player_ids: [player_5, player_6]          # null = every player

initialization:
  utilities:
    mode: manual
    require_weights_sum_to_one: true

  endowments:
    mode: manual
    require_nonnegative_integer_entries: true
    avoid_initial_optimal_bundle: true
    require_gains_from_trade_exist: true

  personas:
    mode: generated_from_preferences
    include_exact_formula_in_prompt: false

stopping:
  stop_after_all_rounds: true
  stop_if_no_trades_for_n_rounds: null
  stop_if_market_converged: false

logging:
  output_dir: C:/ExperimentRuns/LLM_Barter_Env/runs
  save_config_snapshot: true
  save_event_jsonl: true
  save_trade_json: true
  save_summary_json: true
  save_raw_prompts: true
  save_raw_model_outputs: true
  save_preference_probes: true
  pretty_print_transcripts: true

  filenames:
    events: events.jsonl
    trades: trades.json
    summary: summary.json
    preference_probes: preference_probes.json
    shadow_trades: shadow_trades.json
    transcripts: transcripts.txt